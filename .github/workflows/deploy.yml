name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let an in-flight deploy finish (GitHub's own Pages template does the same).
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # 41 MB model, cached between runs. The key includes the alias file so a
      # vocabulary change re-runs the grammar-vs-model check inside model:fetch.
      - name: Cache Vosk model
        uses: actions/cache@v4
        with:
          path: public/models
          key: vosk-model-small-en-us-0.15-${{ hashFiles('scripts/fetch-vosk-model.sh', 'scripts/check-vosk-vocab.mjs', 'src/voice/aliases/en.json', 'src/voice/grammar.ts') }}

      - name: Fetch model (checksum + grammar vocabulary check)
        run: npm run model:fetch

      - name: Build
        run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
